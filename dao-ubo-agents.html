    if(hue<.3){col[i3]=.85+Math.random()*.15;col[i3+1]=.7+Math.random()*.2;col[i3+2]=.15+Math.random()*.15}
    else if(hue<.65){col[i3]=.1+Math.random()*.12;col[i3+1]=.5+Math.random()*.3;col[i3+2]=.75+Math.random()*.25}
    else{col[i3]=.7+Math.random()*.3;col[i3+1]=.08+Math.random()*.15;col[i3+2]=.2+Math.random()*.3}
  }else if(cr<.7){
    // Cyan/teal shared
    col[i3]=.12+Math.random()*.12;col[i3+1]=.5+Math.random()*.3;col[i3+2]=.75+Math.random()*.25;
  }else if(cr<.85){
    // Red/magenta shared
    col[i3]=.7+Math.random()*.3;col[i3+1]=.08+Math.random()*.15;col[i3+2]=.15+Math.random()*.25;
  }else{
    // White-hot
    col[i3]=.92+Math.random()*.08;col[i3+1]=.88+Math.random()*.12;col[i3+2]=.82+Math.random()*.18;
  }
}

geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
geo.setAttribute('size',new THREE.BufferAttribute(sz,1));

// Texture
const tex=(()=>{const c=document.createElement('canvas');c.width=64;c.height=64;
const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.08,'rgba(255,255,255,.9)');
g.addColorStop(.3,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

const ptMat=new THREE.ShaderMaterial({
  uniforms:{uTex:{value:tex},uT:{value:0},uPR:{value:Math.min(devicePixelRatio,2)}},
  vertexShader:`
    attribute float size;attribute vec3 color;
    varying vec3 vC;varying float vA;
    uniform float uT,uPR;
    void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);float d=-mv.z;
      float f=sin(uT*1.1+position.x*.007+position.y*.009)*.2+sin(uT*.45+position.y*.011)*.18+.7;
      vA=exp(-.00045*d)*f;
      gl_PointSize=size*uPR*(280./d);gl_PointSize=max(gl_PointSize,.5);
      gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`
    uniform sampler2D uTex;varying vec3 vC;varying float vA;
    void main(){vec4 t=texture2D(uTex,gl_PointCoord);float a=t.a*vA;
    if(a<.005)discard;gl_FragColor=vec4(vC*(.5+.65*t.r),a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
const pts=new THREE.Points(geo,ptMat);sc.add(pts);

// ── HAIR/TRAIL CURVES per particle ──
// Curved lines radiating outward from surface
const HSEG=6;
const hN=TOTAL;
const hGeo=new THREE.BufferGeometry();
const hPos=new Float32Array(hN*HSEG*6);
const hCol=new Float32Array(hN*HSEG*6);
// Precompute trail curve data
const trailDir=new Float32Array(TOTAL*3);
const trailLen=new Float32Array(TOTAL);
const trailCurve=new Float32Array(TOTAL*3);
for(let i=0;i<TOTAL;i++){
  const i3=i*3;
  // Direction: surface normal + randomization
  let nx=baseNorm[i3],ny=baseNorm[i3+1],nz=baseNorm[i3+2];
  const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
  trailDir[i3]=(nx/nl+(Math.random()-.5)*.3);
  trailDir[i3+1]=(ny/nl+(Math.random()-.5)*.3);
  trailDir[i3+2]=(nz/nl+(Math.random()-.5)*.3);
  trailLen[i]=4+Math.random()*25;
  if(Math.random()<.08)trailLen[i]*=3;
  trailCurve[i3]=(Math.random()-.5)*.015;
  trailCurve[i3+1]=(Math.random()-.5)*.015;
  trailCurve[i3+2]=(Math.random()-.5)*.015;
  // Trail color
  for(let s=0;s<HSEG;s++){
    const si=(i*HSEG+s)*6;
    const fade=1-s/HSEG;
    hCol[si]=col[i3]*fade;hCol[si+1]=col[i3+1]*fade;hCol[si+2]=col[i3+2]*fade;
    hCol[si+3]=col[i3]*fade*.3;hCol[si+4]=col[i3+1]*fade*.3;hCol[si+5]=col[i3+2]*fade*.3;
  }
}
hGeo.setAttribute('position',new THREE.BufferAttribute(hPos,3));
hGeo.setAttribute('color',new THREE.BufferAttribute(hCol,3));
const hMat=new THREE.ShaderMaterial({
  vertexShader:`attribute vec3 color;varying vec3 vC;varying float vA;
    void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);
    vA=exp(-.00045*(-mv.z));gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying float vA;
    void main(){float a=length(vC)*vA*.28;if(a<.003)discard;gl_FragColor=vec4(vC,a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
sc.add(new THREE.LineSegments(hGeo,hMat));

// ── MESH EDGES (KNN connections between nearby points) ──
// Compute at runtime for each agent
const edges=[];
for(let a=0;a<AGENTS;a++){
  const off=a*PPR;
  // Simplified: connect each point to 3 nearest within same agent
  for(let i=0;i<PPR;i+=3){
    let best=[[1e9,-1],[1e9,-1],[1e9,-1]];
    for(let j=0;j<PPR;j+=2){
      if(i===j)continue;
      const gi=(off+i)*3,gj=(off+j)*3;
      const dx=target[gi]-target[gj],dy=target[gi+1]-target[gj+1],dz=target[gi+2]-target[gj+2];
      const d=dx*dx+dy*dy+dz*dz;
      for(let k=0;k<3;k++){if(d<best[k][0]){best.splice(k,0,[d,off+j]);best.pop();break}}
    }
    for(const[,j] of best)if(j>=0)edges.push(off+i,j);
  }
}
const EN=edges.length/2;
const eGeo=new THREE.BufferGeometry();
const ePos=new Float32Array(EN*6);
eGeo.setAttribute('position',new THREE.BufferAttribute(ePos,3));
const eMat=new THREE.ShaderMaterial({
  vertexShader:`varying float vA;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);
    vA=exp(-.00045*(-mv.z));gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vA;void main(){gl_FragColor=vec4(vec3(.4,.38,.35),vA*.08);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
sc.add(new THREE.LineSegments(eGeo,eMat));

// ── ANIMATION ──
const pA=geo.attributes.position.array;
const hpA=hGeo.attributes.position.array;
const epA=eGeo.attributes.position.array;
const ease=x=>{x=Math.max(0,Math.min(x,1));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeOut=x=>{x=Math.max(0,Math.min(x,1));return 1-Math.pow(1-x,3)};

// Sequenced entry: each agent appears 0.6s after previous
const agentDelay=[0, 0.6, 1.2, 1.8, 2.4];

const T0=performance.now();

(function loop(){
  requestAnimationFrame(loop);
  const t=(performance.now()-T0)*.001;
  const ct=t%18; // 18s cycle

  // Timeline:
  // 0-1: silence
  // 1-6: agents assemble sequentially
  // 6-11: hold, breathe, rotate
  // 11-14: dissolve
  // 14-17: scattered
  // 17-18: fade

  // Show icon during hold phase (every cycle)
  if(ct>7&&ct<12){iconEl.style.opacity='1'}
  else{iconEl.style.opacity='0'}

  for(let i=0;i<TOTAL;i++){
    const i3=i*3,p=ph[i];
    const agentId=Math.floor(i/PPR);
    const ad=agentDelay[agentId];

    // Per-particle morph
    let lm;
    if(ct<1) lm=0;
    else if(ct<6){
      const at=ct-1-ad-p*.12;
      lm=easeOut(Math.max(0,at/2.5));
    }else if(ct<11) lm=1;
    else if(ct<14){
      const dt=ct-11-p*.08;
      lm=1-easeOut(Math.max(0,dt/2));
    }else lm=0;

    // Position
    pA[i3]=scattered[i3]+(target[i3]-scattered[i3])*lm;
    pA[i3+1]=scattered[i3+1]+(target[i3+1]-scattered[i3+1])*lm;
    pA[i3+2]=scattered[i3+2]+(target[i3+2]-scattered[i3+2])*lm;

    // Organic drift
    const amp=1.2+2*(1-lm);
    pA[i3]+=Math.sin(t*bf[i3]+p)*amp;
    pA[i3+1]+=Math.sin(t*bf[i3+1]+p*1.3)*amp;
    pA[i3+2]+=Math.sin(t*bf[i3+2]+p*.9)*amp*.4;

    // Scattered drift
    if(lm<.2){
      scattered[i3]+=Math.sin(t*.08+p)*.12;
      scattered[i3+1]+=Math.cos(t*.06+p*1.3)*.12;
    }

    // ── CURVED TRAILS ──
    const tl=trailLen[i]*(.2+.8*lm)*(.5+.5*Math.sin(t*.35+p));
    let cx=pA[i3],cy=pA[i3+1],cz=pA[i3+2];
    let dx=trailDir[i3],dy=trailDir[i3+1],dz=trailDir[i3+2];
    const step=tl/HSEG;
    
    for(let s=0;s<HSEG;s++){
      const si=(i*HSEG+s)*6;
      hpA[si]=cx;hpA[si+1]=cy;hpA[si+2]=cz;
      // Advance along curved path
      dx+=trailCurve[i3]*step+Math.sin(t*.3+s*.4+p)*.003*step;
      dy+=trailCurve[i3+1]*step;
      dz+=trailCurve[i3+2]*step;
      cx+=dx*step;cy+=dy*step;cz+=dz*step;
      hpA[si+3]=cx;hpA[si+4]=cy;hpA[si+5]=cz;
    }
  }
  geo.attributes.position.needsUpdate=true;
  hGeo.attributes.position.needsUpdate=true;

  // Edges
  for(let e=0;e<EN;e++){
    const e6=e*6,a=edges[e*2],b=edges[e*2+1];
    epA[e6]=pA[a*3];epA[e6+1]=pA[a*3+1];epA[e6+2]=pA[a*3+2];
    epA[e6+3]=pA[b*3];epA[e6+4]=pA[b*3+1];epA[e6+5]=pA[b*3+2];
  }
  eGeo.attributes.position.needsUpdate=true;

  // Camera
  const holdPhase=ct>6&&ct<11;
  const baseZ=holdPhase?340:420;
  cam.position.x=Math.sin(t*.04)*25+(holdPhase?Math.sin(t*.08)*15:0);
  cam.position.y=15+Math.sin(t*.035)*8;
  cam.position.z=baseZ+Math.sin(t*.025)*20;
  cam.lookAt(0,-5,0);

  // Gentle group rotation during hold
  const groupRot=holdPhase?Math.sin(t*.06)*.12:Math.sin(t*.03)*.04;
  pts.rotation.y=groupRot;
  sc.children.forEach(c=>{if(c!==pts)c.rotation.y=groupRot});

  ptMat.uniforms.uT.value=t;
  R.render(sc,cam);
})();

addEventListener('resize',rsz);
})();
</script></body></html>
