  fragmentShader:`uniform sampler2D uTex;varying float vA;
    void main(){vec4 t=texture2D(uTex,gl_PointCoord);float a=t.a*vA;
    if(a<.01)discard;gl_FragColor=vec4(vec3(.85,.88,1.),a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})));

// ── AGENT PARTICLES ──
const tgt=new Float32Array(TOTAL*3);
const nrm=new Float32Array(TOTAL*3);
for(let a=0;a<AGENTS;a++){
  const ox=(a-2)*spacing,dO=a*PPR*3;
  for(let i=0;i<PPR;i++){
    const gi=(a*PPR+i)*3,di=dO+i*3;
    tgt[gi]=PI[di]*.1+ox;tgt[gi+1]=PI[di+1]*.1;tgt[gi+2]=PI[di+2]*.1;
    nrm[gi]=NI[di]*.01;nrm[gi+1]=NI[di+1]*.01;nrm[gi+2]=NI[di+2]*.01;
  }
}

const geo=new THREE.BufferGeometry();
const pos=new Float32Array(TOTAL*3);
const col=new Float32Array(TOTAL*3);
const szA=new Float32Array(TOTAL);
const ph=new Float32Array(TOTAL);
const bf=new Float32Array(TOTAL*3);

// Sort particles by agent, then random arrival order within agent
const arrivalOrder=new Float32Array(TOTAL);
for(let a=0;a<AGENTS;a++){
  const indices=[];
  for(let i=0;i<PPR;i++) indices.push(i);
  // Shuffle
  for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}
  for(let i=0;i<PPR;i++) arrivalOrder[a*PPR+indices[i]]=i/PPR; // 0-1 normalized order
}

const agentHues=[0.55,0.95,0.12,0.55,0.8];

for(let i=0;i<TOTAL;i++){
  const i3=i*3,ag=Math.floor(i/PPR);
  // Start FAR away, scattered in space
  pos[i3]=(Math.random()-.5)*2000;
  pos[i3+1]=(Math.random()-.5)*1000;
  pos[i3+2]=-300-Math.random()*1500;
  
  ph[i]=Math.random()*6.28;
  bf[i3]=.3+Math.random()*.8;bf[i3+1]=.25+Math.random()*.7;bf[i3+2]=.2+Math.random()*.6;
  szA[i]=1+Math.random()*2.5;

  const cr=Math.random(),h=agentHues[ag];
  if(cr<.4){
    if(h<.3){col[i3]=.85+Math.random()*.15;col[i3+1]=.7+Math.random()*.2;col[i3+2]=.15+Math.random()*.15}
    else if(h<.65){col[i3]=.1+Math.random()*.12;col[i3+1]=.5+Math.random()*.3;col[i3+2]=.75+Math.random()*.25}
    else{col[i3]=.7+Math.random()*.3;col[i3+1]=.08+Math.random()*.15;col[i3+2]=.2+Math.random()*.3}
  }else if(cr<.65){
    col[i3]=.12+Math.random()*.12;col[i3+1]=.5+Math.random()*.3;col[i3+2]=.75+Math.random()*.25;
  }else if(cr<.82){
    col[i3]=.7+Math.random()*.3;col[i3+1]=.08+Math.random()*.15;col[i3+2]=.15+Math.random()*.25;
  }else{
    col[i3]=.92+Math.random()*.08;col[i3+1]=.88+Math.random()*.12;col[i3+2]=.82+Math.random()*.18;
  }
}

geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
geo.setAttribute('size',new THREE.BufferAttribute(szA,1));

const tex=(()=>{const c=document.createElement('canvas');c.width=64;c.height=64;
const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.08,'rgba(255,255,255,.9)');
g.addColorStop(.3,'rgba(255,255,255,.22)');g.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

const ptMat=new THREE.ShaderMaterial({
  uniforms:{uTex:{value:tex},uT:{value:0},uPR:{value:Math.min(devicePixelRatio,2)}},
  vertexShader:`
    attribute float size;attribute vec3 color;
    varying vec3 vC;varying float vA;
    uniform float uT,uPR;
    void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);float d=-mv.z;
      float f=sin(uT*1.1+position.x*.007+position.y*.009)*.2+sin(uT*.45+position.y*.011)*.18+.7;
      vA=exp(-.0004*d)*f;
      gl_PointSize=size*uPR*(260./d);gl_PointSize=max(gl_PointSize,.5);
      gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`
    uniform sampler2D uTex;varying vec3 vC;varying float vA;
    void main(){vec4 t=texture2D(uTex,gl_PointCoord);float a=t.a*vA;
    if(a<.005)discard;gl_FragColor=vec4(vC*(.5+.65*t.r),a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
sc.add(new THREE.Points(geo,ptMat));

// ── ANIMATION ──
const pA=geo.attributes.position.array;
const spA=starGeo.attributes.position.array;
const easeOut=x=>{x=Math.max(0,Math.min(x,1));return 1-Math.pow(1-x,3)};

// Agent assembly windows (seconds): each agent gets 3s, staggered by 2.5s
// Agent 0: 2-5s, Agent 1: 4.5-7.5s, Agent 2: 7-10s, Agent 3: 9.5-12.5s, Agent 4: 12-15s
const agentStart=[2, 4.5, 7, 9.5, 12];
const agentDur=3; // each agent takes 3s to fully assemble

const T0=performance.now();

(function loop(){
  requestAnimationFrame(loop);
  const t=(performance.now()-T0)*.001;

  // ── STARS: slow drift ──
  const starMat=sc.children[0].material;
  starMat.uniforms.uT.value=t;
  for(let i=0;i<STARS;i++){
    const i3=i*3;
    spA[i3+2]+=.15; // drift toward camera
    if(spA[i3+2]>200){spA[i3+2]=-2500;spA[i3]=(Math.random()-.5)*3000;spA[i3+1]=(Math.random()-.5)*1500}
  }
  starGeo.attributes.position.needsUpdate=true;

  // ── PARTICLES: bod po bodu assembly ──
  for(let i=0;i<TOTAL;i++){
    const i3=i*3,p=ph[i];
    const ag=Math.floor(i/PPR);
    const aStart=agentStart[ag];
    const arrival=arrivalOrder[i]; // 0-1: when this particle arrives within its agent's window

    // This particle's personal assembly time
    const myStart=aStart+arrival*agentDur;
    const myEnd=myStart+.8; // takes 0.8s per particle to settle

    let lm;
    if(t<myStart) lm=0;
    else if(t<myEnd) lm=easeOut((t-myStart)/.8);
    else lm=1;

    // Target with breathing
    let tx=tgt[i3],ty=tgt[i3+1],tz=tgt[i3+2];
    if(lm>=1){
      tx+=Math.sin(t*.4+p)*1;
      ty+=Math.sin(t*.35+p*1.3)*1;
      tz+=Math.sin(t*.3+p*.9)*.4;
    }

    if(lm<=0){
      // Floating in space — gentle drift
      pA[i3]+=Math.sin(t*.05+p)*.08;
      pA[i3+1]+=Math.cos(t*.04+p*1.3)*.08;
      pA[i3+2]+=.05; // slowly toward camera like stars
    }else if(lm<1){
      // Flying toward target
      pA[i3]+=(tx-pA[i3])*(.02+lm*.08);
      pA[i3+1]+=(ty-pA[i3+1])*(.02+lm*.08);
      pA[i3+2]+=(tz-pA[i3+2])*(.02+lm*.08);
    }else{
      // Settled — stay near target with breathing
      pA[i3]+=(tx-pA[i3])*.1;
      pA[i3+1]+=(ty-pA[i3+1])*.1;
      pA[i3+2]+=(tz-pA[i3+2])*.1;
    }
  }
  geo.attributes.position.needsUpdate=true;

  // ── ROBOT ICON: flies in from distance at the end ──
  // Assembly finishes at ~15s. Robot appears 16-20s.
  const robotStart=16;
  const robotSettle=18.5; // fully settled
  if(t>robotStart){
    const rp=Math.min((t-robotStart)/(robotSettle-robotStart),1);
    const re=easeOut(rp);
    // Start from scale(3) far away, end at scale(1) centered
    const sc_val=1+2*(1-re);
    const opacity=Math.min(re*1.5,1);
    robotEl.style.opacity=opacity;
    robotEl.style.transform=`translate(-50%,-50%) scale(${sc_val})`;
    robotEl.style.filter=`drop-shadow(0 0 ${20*re}px rgba(255,255,255,${.15*re}))`;
  }else{
    robotEl.style.opacity='0';
  }

  // ── CAMERA: very slow cinematic ──
  const camX=Math.sin(t*.025)*15;
  const camY=10+Math.sin(t*.02)*5;
  const camZ=450-Math.min(t/20,1)*30;
  cam.position.set(camX,camY,camZ);
  cam.lookAt(0,-5,0);

  // Subtle rotation
  sc.children.forEach(c=>{if(c.type==='Points'&&c!==sc.children[0])c.rotation.y=Math.sin(t*.03)*.05});

  ptMat.uniforms.uT.value=t;
  Re.render(sc,cam);
})();

addEventListener('resize',rsz);
})();
</script></body></html>
