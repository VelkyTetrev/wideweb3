<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;height:100vh}
canvas{position:fixed;top:0;left:0;z-index:0}
.vig{
  position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;
  background:
    radial-gradient(ellipse at 55% 40%,transparent 32%,rgba(10,10,18,0.55)100%),
    linear-gradient(to top,rgba(10,10,18,0.96)0%,transparent 28%),
    linear-gradient(to right,rgba(10,10,18,0.75)0%,transparent 20%);
}
nav{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 36px;pointer-events:auto;
}
.logo{font-weight:700;font-size:1.15rem;color:#fff;text-decoration:none}
.logo b{color:#c9a84c}
nav ul{list-style:none;display:flex;gap:24px}
nav a{color:rgba(255,255,255,0.35);text-decoration:none;font-size:.75rem;font-weight:500;letter-spacing:.04em;transition:color .25s}
nav a:hover{color:rgba(255,255,255,0.7)}
.hero{
  position:fixed;bottom:5vh;left:0;right:0;text-align:center;z-index:20;
  pointer-events:auto;padding:0 24px;
}
.hero h1{
  font-size:clamp(2rem,5.5vw,3rem);font-weight:800;
  line-height:1.1;letter-spacing:-.02em;margin-bottom:12px;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(135deg,#c9a84c,#e8cc78);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero .sub{
  font-size:.88rem;font-weight:400;color:rgba(255,255,255,0.4);
  line-height:1.6;max-width:420px;margin:0 auto 24px;
}
.ctas{display:flex;justify-content:center;gap:12px}
.btn{
  font-family:inherit;font-size:.85rem;padding:12px 32px;border-radius:12px;
  cursor:pointer;text-decoration:none;transition:all .25s;font-weight:600;border:none;
}
.btn-p{background:#3b82f6;color:#fff}
.btn-p:hover{background:#2563eb;box-shadow:0 6px 24px rgba(59,130,246,.3);transform:translateY(-1px)}
.btn-s{background:transparent;color:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.1)}
.btn-s:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.65)}
@media(max-width:768px){nav{padding:16px 20px}nav ul{display:none}.hero{bottom:3vh}}
</style>

const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
const hd=new Float32Array(bin.buffer);
const N=11600;

const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setSize(innerWidth,innerHeight);
R.setClearColor(0x0a0a12);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,1,4000);
cam.position.set(0,0,600);

// ── BUFFERS ──
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(N*3);
const col=new Float32Array(N*3);
const sz=new Float32Array(N);
const ph=new Float32Array(N);
const bf=new Float32Array(N*3);
const td=new Float32Array(N*2);
const tl=new Float32Array(N);
// Store original scattered positions for disperse effect
const scattered=new Float32Array(N*3);

for(let i=0;i<N;i++){
  const i3=i*3;
  // Scattered start positions (sphere distribution)
  const sa=Math.random()*6.28, sv=Math.acos(2*Math.random()-1);
  const sr=300+Math.random()*400;
  scattered[i3]=sr*Math.sin(sv)*Math.cos(sa);
  scattered[i3+1]=sr*Math.sin(sv)*Math.sin(sa);
  scattered[i3+2]=sr*Math.cos(sv);
  pos[i3]=scattered[i3];pos[i3+1]=scattered[i3+1];pos[i3+2]=scattered[i3+2];

  ph[i]=Math.random()*6.28;
  bf[i3]=.3+Math.random()*.8;
  bf[i3+1]=.25+Math.random()*.7;
  bf[i3+2]=.2+Math.random()*.6;

  // Trail direction
  const dx=hd[i3],dy=hd[i3+1],dist=Math.sqrt(dx*dx+dy*dy)||1;
  const ang=Math.atan2(dy,dx)+(Math.random()-.5)*.5;
  td[i*2]=Math.cos(ang);td[i*2+1]=Math.sin(ang);
  tl[i]=5+(dist/100)*50+Math.random()*20;
  if(Math.random()<.07) tl[i]*=2.5;

  // COLORS matching reference: cyan/blue + red/magenta + yellow/white core
  const cr=Math.random();
  if(cr<.35){
    // Cyan / blue (dominant in reference)
    col[i3]=.15+Math.random()*.15;
    col[i3+1]=.5+Math.random()*.3;
    col[i3+2]=.75+Math.random()*.25;
  }else if(cr<.6){
    // Red / magenta
    col[i3]=.7+Math.random()*.3;
    col[i3+1]=.1+Math.random()*.15;
    col[i3+2]=.2+Math.random()*.25;
  }else if(cr<.8){
    // Yellow / gold (bright core particles)
    col[i3]=.9+Math.random()*.1;
    col[i3+1]=.75+Math.random()*.2;
    col[i3+2]=.2+Math.random()*.2;
  }else{
    // White-hot highlights
    col[i3]=.9+Math.random()*.1;
    col[i3+1]=.85+Math.random()*.15;
    col[i3+2]=.8+Math.random()*.2;
  }
  sz[i]=.7+Math.random()*2.5;
}
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
geo.setAttribute('size',new THREE.BufferAttribute(sz,1));

// Particle texture
const tex=(()=>{const c=document.createElement('canvas');c.width=64;c.height=64;
const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);
g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.1,'rgba(255,255,255,.85)');
g.addColorStop(.35,'rgba(255,255,255,.2)');g.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

const ptMat=new THREE.ShaderMaterial({
  uniforms:{uTex:{value:tex},uT:{value:0},uPR:{value:Math.min(devicePixelRatio,2)}},
  vertexShader:`
    attribute float size;attribute vec3 color;
    varying vec3 vC;varying float vA;
    uniform float uT,uPR;
    void main(){
      vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);
      float d=-mv.z;
      float f=sin(uT*1.3+position.x*.01+position.y*.008)*.3
             +sin(uT*.55+position.y*.013)*.2+.6;
      vA=exp(-.0005*d)*f;
      gl_PointSize=size*uPR*(300./d);
      gl_PointSize=max(gl_PointSize,.5);
      gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`
    uniform sampler2D uTex;varying vec3 vC;varying float vA;
    void main(){vec4 t=texture2D(uTex,gl_PointCoord);
    float a=t.a*vA;if(a<.008)discard;
    gl_FragColor=vec4(vC*(.55+.65*t.r),a);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
});
const pts=new THREE.Points(geo,ptMat);
scene.add(pts);

// ── TRAILS ──
const tG=new THREE.BufferGeometry();
const tP=new Float32Array(N*6);
const tC=new Float32Array(N*6);
for(let i=0;i<N;i++){
  const i3=i*3,i6=i*6;
  tC[i6]=col[i3];tC[i6+1]=col[i3+1];tC[i6+2]=col[i3+2];
  tC[i6+3]=col[i3]*.1;tC[i6+4]=col[i3+1]*.1;tC[i6+5]=col[i3+2]*.1;
}
tG.setAttribute('position',new THREE.BufferAttribute(tP,3));
tG.setAttribute('color',new THREE.BufferAttribute(tC,3));
const tMat=new THREE.ShaderMaterial({
  vertexShader:`attribute vec3 color;varying vec3 vC;varying float vA;
    void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);
    vA=exp(-.0005*(-mv.z));gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC;varying float vA;
    void main(){gl_FragColor=vec4(vC,length(vC)*vA*.35);}`,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
});
const trM=new THREE.LineSegments(tG,tMat);
scene.add(trM);

// ── MOUSE INTERACTION ──
let mx=0,my=0,mDown=false,mDist=0;
addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2});
addEventListener('mousedown',()=>{mDown=true});
addEventListener('mouseup',()=>{mDown=false});
addEventListener('touchstart',()=>{mDown=true},{passive:true});
addEventListener('touchend',()=>{mDown=false},{passive:true});

// ── STATE ──
let morphT=0; // 0=scattered, 1=hand formed
let disperseT=0; // 0=normal, 1=dispersed
const pA=geo.attributes.position.array;
const tpA=tG.attributes.position.array;

(function loop(){
  requestAnimationFrame(loop);
  const t=performance.now()*.001;

  // Touch/click disperses particles, release re-assembles
  if(mDown){disperseT=Math.min(disperseT+.04,1)}
  else{disperseT=Math.max(disperseT-.015,0)}

  // Initial morph-in
  morphT=Math.min(morphT+.008,1);
  const mE=1-Math.pow(1-morphT,3);

  // Disperse easing
  const dE=disperseT*disperseT;

  for(let i=0;i<N;i++){
    const i3=i*3,i6=i*6,p=ph[i];

    // Target: blend between hand and scattered
    const tx=hd[i3]*(1-dE)+scattered[i3]*dE;
    const ty=hd[i3+1]*(1-dE)+scattered[i3+1]*dE;
    const tz=hd[i3+2]*(1-dE)+scattered[i3+2]*dE;

    // Move toward target
    const speed=.04+dE*.03;
    pA[i3]+=(tx-pA[i3])*speed;
    pA[i3+1]+=(ty-pA[i3+1])*speed;
    pA[i3+2]+=(tz-pA[i3+2])*speed;

    // Organic drift (never stops)
    const amplitude=1.5+dE*3;
    const ox=Math.sin(t*bf[i3]+p)*amplitude+Math.sin(t*bf[i3]*.37+p*2.1)*amplitude*.5;
    const oy=Math.sin(t*bf[i3+1]+p*1.3)*amplitude*1.1+Math.cos(t*bf[i3+1]*.41+p*.5)*amplitude*.6;
    const oz=Math.sin(t*bf[i3+2]+p*.9)*amplitude*.6;

    const fx=pA[i3]+ox, fy=pA[i3+1]+oy, fz=pA[i3+2]+oz;

    // Trail pulsation
    const pulse=.3+.7*(.5+.5*Math.sin(t*.45+p))*(.6+.4*Math.sin(t*.17+p*2.3));
    const trailScale=1-dE*.5; // shorter trails when dispersed
    const len=tl[i]*pulse*trailScale;

    tpA[i6]=fx;tpA[i6+1]=fy;tpA[i6+2]=fz;
    tpA[i6+3]=fx+td[i*2]*len;
    tpA[i6+4]=fy+td[i*2+1]*len;
    tpA[i6+5]=fz;
  }
  geo.attributes.position.needsUpdate=true;
  tG.attributes.position.needsUpdate=true;

  // Camera: sway + mouse + rotation on drag
  const sx=Math.sin(t*.11)*10+Math.sin(t*.047)*5;
  const sy=Math.sin(t*.085)*6+Math.cos(t*.063)*3;
  cam.position.x+=(mx*35+sx-cam.position.x)*.025;
  cam.position.y+=(-my*22+sy-cam.position.y)*.025;
  cam.lookAt(0,-15,0);

  // Slow auto-rotation + mouse Y rotation
  const rot=Math.sin(t*.065)*.15+Math.sin(t*.028)*.07+mx*.1;
  pts.rotation.y=rot;trM.rotation.y=rot;

  ptMat.uniforms.uT.value=t;
  R.render(scene,cam);
})();

addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  R.setSize(innerWidth,innerHeight);
});
})();
</script>
